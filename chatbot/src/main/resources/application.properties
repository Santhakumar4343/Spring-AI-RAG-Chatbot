spring.application.name=chatbot

# 8080 is taken by an SSH tunnel to Jenkins on this machine
server.port=8081

# ---- Google Gemini ----
# The key is read from the GEMINI_API_KEY environment variable (never commit real keys)
spring.ai.google.genai.api-key=${GEMINI_API_KEY}

# Chat model (the LLM that writes answers)
spring.ai.google.genai.chat.options.model=gemini-3.5-flash
spring.ai.google.genai.chat.options.temperature=0.2

# Fail fast instead of silently retrying for minutes when Gemini is overloaded (503)
spring.ai.retry.max-attempts=2
spring.ai.retry.backoff.initial-interval=2s

# Embedding model (turns text into vectors for search)
spring.ai.google.genai.embedding.api-key=${GEMINI_API_KEY}
spring.ai.google.genai.embedding.text.options.model=gemini-embedding-001
